<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nube Local - SPA Client</title>
    <link rel="stylesheet" href="CloudStyle.css">
    <script src="ArtPlayer.js"></script>
</head>
<body>
    <header>
        <h1 id="pathTitle">📂 Servidor Local: /</h1>
        
        <input type="file" id="fileInput" style="display: none;">
        <button type="button" onclick="document.getElementById('fileInput').click();">Subir Archivo</button>
        <button type="button" class="btn btn-danger" onclick="deleteSelected();">Borrar Seleccionados</button>
    </header>

    <div id="navigation"></div>
    <ul id="fileList"></ul>

    <div id="artplayer" style="width: 800px; height: 450px; display: none;"></div>

    <script src="app.js"></script>
</body>
</html>
